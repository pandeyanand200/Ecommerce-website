version: '3.8'

services:
  backend:
    build: ./backend
    container_name: luxe_ecommerce_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    restart: always

  frontend:
    build: ./frontend
    container_name: luxe_ecommerce_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

